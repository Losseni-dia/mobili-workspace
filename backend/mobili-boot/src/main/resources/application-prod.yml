# ---------------------------------------------------------------------------
# Profil PROD — production
# ---------------------------------------------------------------------------
spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.mobili.backend: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mobili:
  cors:
    allowed-origins:
      - https://my-mobili.com
      - https://www.my-mobili.com
      - https://business.my-mobili.com
      - http://localhost
  public:
    # Site voyageur réel (le "www." est indispensable : my-mobili.com sans www ne résout pas).
    frontend-url: ${FRONTEND_URL:https://www.my-mobili.com}
  security:
    refresh:
      secure: true

fedapay:
  # "sandbox" tant que FEDAPAY_SECRET_KEY est une cle de test (situation actuelle, phase de
  # test) -- repasser sur "live" (ou definir FEDAPAY_ENVIRONMENT=live cote serveur) le jour
  # ou une vraie cle de production FedaPay est fournie.
  environment: ${FEDAPAY_ENVIRONMENT:sandbox}
  secret:
    key: ${FEDAPAY_SECRET_KEY}
  webhook:
    secret: ${FEDAPAY_WEBHOOK_SECRET}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}