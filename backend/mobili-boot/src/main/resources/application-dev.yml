# ---------------------------------------------------------------------------
# Profil DEV — développement local
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mobili_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.mobili.backend: DEBUG
    org.hibernate.SQL: DEBUG

mobili:
  security:
    refresh:
      secure: false