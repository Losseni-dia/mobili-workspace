# ---------------------------------------------------------------------------
# Profil STAGING — recette / préproduction
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mobili_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.mobili.backend: INFO
    org.hibernate.SQL: WARN

mobili:
  cors:
    allowed-origins:
      - https://staging.my-mobili.com
      - http://localhost:4200
      - http://localhost:4201
      - capacitor://localhost
      - http://localhost
  public:
    frontend-url: ${FRONTEND_URL:https://staging.my-mobili.com}
  security:
    jwt:
      secret-key: ${JWT_SECRET}
    refresh:
      secure: true

fedapay:
  secret:
    key: ${FEDAPAY_SECRET_KEY}
  webhook:
    secret: ${FEDAPAY_WEBHOOK_SECRET}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}