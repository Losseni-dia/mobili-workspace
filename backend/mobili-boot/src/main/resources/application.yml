# ---------------------------------------------------------------------------
# Configuration globale Mobili — commune à tous les profils
# ---------------------------------------------------------------------------
server:
  port: 8080
  servlet:
    context-path: /v1

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 70MB
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  data:
    redis:
      repositories:
        enabled: false
  jackson:
    time-zone: UTC

# ---------------------------------------------------------------------------
# Configuration spécifique Mobili
# ---------------------------------------------------------------------------
mobili:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:4201
      - http://localhost
      - http://localhost:81
      - http://127.0.0.1:4200
      - http://127.0.0.1:4201
      - http://127.0.0.1
      - http://127.0.0.1:81

  public:
    # URL du site web (Angular) — utilisée pour les redirections navigateur après paiement
    # (Stripe success/cancel, retour FedaPay). Ne jamais pointer vers l'API (api.my-mobili.com) :
    # ce sont des pages Angular (/payment/success, /booking/confirmation/:id), pas des endpoints.
    frontend-url: ${FRONTEND_URL:http://localhost:4200}

  ui:
    show-success-messages: ${APP_SHOW_SUCCESS_MESSAGES:false}

  security:
    rate-limit:
      enabled: true
      login-refresh-per-minute: 25
      register-mutations-per-minute: 10
      gare-preview-per-minute: 60
      payment-webhook-per-minute: 120
      redis:
        enabled: ${REDIS_RATE_LIMIT_ENABLED:false}
        key-prefix: mobili:rl
        allow-on-redis-failure: true
    jwt:
      secret-key: ${JWT_SECRET}
    refresh:
      cookie-name: MOBILI_REFRESH
      max-age-seconds: 604800
      path: /v1
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: Lax

  backend:
    upload:
      root-directory: ${BACKEND_UPLOAD_DIR:uploads}
      users: users
      partners: partners
      vehicles: vehicles
      documents-folder: documents
      max-bytes-per-file: 12582912
      max-bytes-per-document: 5242880

# ---------------------------------------------------------------------------
# Services Externes
# ---------------------------------------------------------------------------
fedapay:
  # "sandbox" ou "live" — doit correspondre au type de FEDAPAY_SECRET_KEY fourni (une clé
  # live utilisée en environnement sandbox, ou l'inverse, fait échouer tous les appels API.
  environment: ${FEDAPAY_ENVIRONMENT:sandbox}
  secret:
    key: ${FEDAPAY_SECRET_KEY}
  webhook:
    secret: ${FEDAPAY_WEBHOOK_SECRET}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

payment:
  exchange:
    # Taux fixe EUR/XOF (traité BCEAO / Trésor français), pas une approximation.
    # Valeur par défaut fournie car non sensible (donnée publique) — contrairement aux
    # secrets ci-dessus, surchargeable via PAYMENT_EXCHANGE_XOF_EUR_RATE si besoin.
    xof-eur-rate: ${PAYMENT_EXCHANGE_XOF_EUR_RATE:655.957}

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO