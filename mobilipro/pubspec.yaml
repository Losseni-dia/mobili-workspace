# Icone/splash regeneres (fond bleu Mobili) — voir commit 83d68bf.
name: mobilipro
description: Application professionnelle MobiliPro — gestion transport Afrique
version: 1.0.0+4

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  json_annotation: ^4.9.0
  go_router: ^13.2.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.4.3
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  google_fonts: ^6.2.1
  image_picker: ^1.2.2
  file_picker: ^8.1.2 # pièce jointe messages "Support" (image ou PDF)
  mobile_scanner: ^5.2.3
  share_plus: ^10.0.0
  csv: ^6.0.0
  pdf: ^3.11.1
  fl_chart: ^0.69.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.0.0
  flutter_local_notifications: ^17.0.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.2

dependency_overrides:
  # flutter_plugin_android_lifecycle >=2.0.28 exige compileSdk 36 côté consommateurs, mais le
  # module Android de file_picker (transitif via image_picker/mobile_scanner aussi) est encore
  # compilé en compileSdk 34 côté pub.dev → échec CheckAarMetadata en CI. On repointe sur la
  # dernière version compatible compileSdk 34 en attendant que ces plugins publient une mise à
  # jour cohérente entre eux. Même fix que mobile_app.
  flutter_plugin_android_lifecycle: 2.0.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  # Repli "à plat" (Android < 8 / API < 26, sans icône adaptative) : le PNG source est
  # transparent, et flutter_launcher_icons l'aplatit sur fond BLANC pour cette variante --
  # jamais bleu Mobili sans ce fichier pré-composité. adaptive_icon_foreground, lui, reste sur
  # l'original transparent (le fond bleu y est géré via adaptive_icon_background).
  image_path: "assets/icons/launcher_icon_legacy_blue_bg.png"
  min_sdk_android: 21
  adaptive_icon_background: "#092990"
  adaptive_icon_foreground: "assets/icons/launcher_icon.png"

flutter_native_splash:
  color: "#092990"
  fullscreen: true
  android: true
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/