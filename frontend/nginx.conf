server {
    listen 80;
    server_name localhost;

    # TLS terminé en amont (load balancer) : ce conteneur ne voit que du HTTP, donc $scheme
    # vaut toujours "http" ici. Sans ceci, les redirections automatiques de Nginx (ex. ajout
    # du "/" final sur /confidentialite, /cgu) génèrent une Location: http://... même quand le
    # client a demandé en HTTPS — downgrade de sécurité involontaire. Redirections relatives
    # (juste le chemin) au lieu d'absolues : le navigateur garde le schéma d'origine.
    # Même correctif déjà en place dans nginx.business.prod.conf.
    absolute_redirect off;

    # Aligné sur spring.servlet.multipart.max-request-size (application.yml) : sans ceci,
    # Nginx applique sa limite par défaut de 1 Mo et rejette en 413 toute requête multipart
    # (ex. inscription société avec logo + pièces KYC) avant même qu'elle n'atteigne le backend.
    client_max_body_size 70M;

    # En-têtes de sécurité HTTP (backlog post-lancement, section 5) — s'ajoutent au HTTPS déjà en
    # place (terminé en amont par le load balancer), ne le remplacent pas : le HTTPS chiffre la
    # connexion, ces en-têtes indiquent au navigateur des règles de comportement supplémentaires.
    #
    # CSP `unsafe-inline` sur script-src/style-src : nécessaire tant qu'Angular injecte du CSS de
    # composant et un script de bootstrap (ng-event-dispatch-contract) directement inline dans le
    # HTML, et que le script d'init Plausible (voir index.html) est lui aussi inline — un passage
    # à des nonces CSP par requête romprait le prerendering statique (SSG) des pages, donc laissé
    # de côté pour l'instant (protection XSS réduite sur ce point précis, mais domaines externes
    # toujours restreints à la liste explicite ci-dessous).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://plausible.io https://*.sentry.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location ^~ /v1/ {
        # ⚠️ TEMPORAIRE (2026-09-12) : rebranché sur 8080 (mobili-backend-staging) à la demande
        # explicite de l'utilisateur, pour tester en conditions réelles les nouvelles pages
        # /trajets/:from/:to avec de vraies données (staging en a, prod est encore vide). À
        # REMETTRE sur 8081 (mobili-backend-prod) dès la fin des tests — voir Étape 7 du chantier
        # séparation staging/prod (C:\Users\User\.claude\plans\virtual-munching-pebble.md) pour le
        # contexte complet de cette bascule.
        proxy_pass http://host.docker.internal:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        # ⚠️ TEMPORAIRE — voir commentaire ci-dessus (location /v1/).
        proxy_pass http://host.docker.internal:8080/v1/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSR à la demande (RenderMode.Server, voir app.routes.server.ts) — seule route dont le
    # contenu dépend des query params (villes/date recherchées), donc impossible à prérendre au
    # build. Toutes les autres pages restent servies statiquement ci-dessous (location /), sans
    # jamais toucher au conteneur Node ssr-runtime. Match exact ($uri sans les query params, donc
    # ?departure=...&arrival=... n'affecte pas ce choix de location).
    location = /search-results {
        proxy_pass http://host.docker.internal:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}