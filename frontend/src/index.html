  <!-- "Afrique de l'Ouest" plutôt qu'un seul pays : le réseau de trajets dépasse déjà la Côte
       d'Ivoire (liaisons vers le Sénégal, le Ghana, le Mali, le Burkina Faso, la Guinée...) — ne
       pas se limiter à "Côte d'Ivoire" ici pour ne pas devoir réécrire ce texte à chaque nouveau
       pays ajouté, sans tomber non plus dans "Afrique" (bien trop vague pour être un signal SEO
       utile). Mettre à jour si la zone de couverture change fondamentalement. -->
  <meta name="description" content="Réservez vos billets de bus, car et covoiturage en Côte d'Ivoire, au Sénégal, au Ghana, au Mali. Paiement Wave, Orange Money, MTN Money, carte bancaire.">

  <meta name="google-site-verification" content="a9Y3tZZ9BHLAuY_lylIP9Y7PbRdcVnwuhlJZ1WuCEiY" />
  <!-- Données structurées (schema.org) : signale à Google le nom de marque "Mobili" et son logo,
       pour augmenter la chance qu'il affiche "Mobili" plutôt que le nom de domaine brut
       (my-mobili.com) au-dessus du résultat de recherche — un signal, pas un réglage garanti. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Mobili",
    "url": "https://www.my-mobili.com",
    "logo": "https://www.my-mobili.com/assets/images/ecrito-bleu.png",
    "description": "Plateforme de réservation de transport interurbain et de covoiturage en Afrique de l'Ouest."
  }
  </script>
