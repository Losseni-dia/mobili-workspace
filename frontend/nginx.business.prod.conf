server {
    listen 81; # Indispensable pour éviter le conflit avec le Front User
    server_name localhost;

    absolute_redirect off;

    # Aligné sur spring.servlet.multipart.max-request-size (application.yml) : sans ceci,
    # Nginx applique sa limite par défaut de 1 Mo et rejette en 413 toute requête multipart
    # (ex. inscription société avec logo + pièces KYC) avant même qu'elle n'atteigne le backend.
    client_max_body_size 70M;

    # En-têtes de sécurité HTTP — voir nginx.conf (site public) pour le raisonnement complet.
    # Pas de Plausible/Sentry ici (pas encore branchés sur ce portail) — CSP plus restrictive en
    # conséquence, à réaligner si ces outils sont un jour ajoutés à Mobili Business aussi.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    root /usr/share/nginx/html;

    location ^~ /v1/ {
        # 'backend' devient 'localhost' car ils partagent le même réseau Task
        # Bascule 2026-09-11 (Étape 7, voir C:\Users\User\.claude\plans\virtual-munching-pebble.md) :
        # business.my-mobili.com sert désormais le vrai trafic via mobili-backend-prod (8081).
        proxy_pass http://host.docker.internal:8081/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://host.docker.internal:8081/v1/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}