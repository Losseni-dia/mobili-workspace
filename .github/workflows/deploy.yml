name: Deploy Mobili Backend (jar + systemd — DÉSACTIVÉ, remplacé par deploy-backend-docker.yml)

# Ancien chemin de déploiement (jar copié par scp, lancé via systemd) — remplacé le 2026-09-11 par
# deploy-backend-docker.yml (voir ce fichier + docs/INFRA-OPS.md). mobili.service et
# mobili-prod.service sont désormais stop+disable sur l'EC2, remplacés par des conteneurs Docker
# occupant les mêmes ports (8080/8081) : si ce workflow se redéclenchait automatiquement, son
# "systemctl restart" relancerait l'ancien jar en conflit de port avec les conteneurs Docker déjà
# en place. Déclenchement automatique retiré ; gardé en workflow_dispatch pour rollback manuel
# uniquement si le chantier Docker devait être annulé.
on:
  workflow_dispatch:

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build
        working-directory: backend
        run: mvn clean package -DskipTests
      - name: Deploy to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/mobili-boot/target/application.jar"
          target: "/home/ec2-user/"
          strip_components: 3
      - name: Restart staging service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: sudo systemctl restart mobili

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build
        working-directory: backend
        run: mvn clean package -DskipTests
      - name: Deploy to prod
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/mobili-boot/target/application.jar"
          target: "/home/ec2-user/incoming-prod/"
          strip_components: 3
      - name: Rename and restart prod service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mv /home/ec2-user/incoming-prod/application.jar /home/ec2-user/application-prod.jar
            sudo systemctl restart mobili-prod