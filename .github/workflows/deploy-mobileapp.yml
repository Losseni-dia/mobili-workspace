name: Deploy Mobili User App (Firebase App Distribution)

on:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mobileapp-${{ hashFiles('mobile_app/android/**/*.gradle*', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-mobileapp-

      - name: Decode keystore
        run: echo "${{ secrets.MOBILEAPP_KEYSTORE_BASE64 }}" | base64 --decode > mobile_app/android/app/release-keystore.jks

      - name: Decode google-services.json
        run: echo "${{ secrets.MOBILEAPP_GOOGLE_SERVICES_BASE64 }}" | base64 --decode > mobile_app/android/app/google-services.json

      - name: Get dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile_app
        env:
          MOBILEAPP_KEYSTORE_PATH: ${{ github.workspace }}/mobile_app/android/app/release-keystore.jks
          MOBILEAPP_KEYSTORE_PASSWORD: ${{ secrets.MOBILEAPP_KEYSTORE_PASSWORD }}
          MOBILEAPP_KEY_ALIAS: ${{ secrets.MOBILEAPP_KEY_ALIAS }}
          MOBILEAPP_KEY_PASSWORD: ${{ secrets.MOBILEAPP_KEY_PASSWORD }}
        run: flutter build apk --release

      # wzieba/Firebase-Distribution-Github-Action n'expose aucune option de
      # retry/timeout : un upload qui traine (reseau runner <-> Firebase) fait
      # echouer tout le job apres 300000ms, sans nouvelle tentative (vu 2 fois
      # de suite). nick-fields/retry relance la meme commande jusqu'a 3 fois.
      - name: Distribute via Firebase (avec retry)
        uses: nick-fields/retry@v3
        env:
          FIREBASE_TOKEN_FILE_CONTENT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          timeout_minutes: 6
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            echo "$FIREBASE_TOKEN_FILE_CONTENT" > /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@13 appdistribution:distribute \
              mobile_app/build/app/outputs/flutter-apk/app-release.apk \
              --app "1:908432245037:android:37bd001a965d2da22bd3a4" \
              --groups "Mobili-user"