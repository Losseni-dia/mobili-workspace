name: Deploy MobiliPro (Firebase App Distribution)

on:
  push:
    branches: [main]
    paths:
      - 'mobilipro/**'
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mobilipro-${{ hashFiles('mobilipro/android/**/*.gradle*', 'mobilipro/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-mobilipro-

      - name: Decode keystore
        run: echo "${{ secrets.MOBILIPRO_KEYSTORE_BASE64 }}" | base64 --decode > mobilipro/android/app/release-keystore.jks

      - name: Get dependencies
        working-directory: mobilipro
        run: flutter pub get

      - name: Build release APK
        working-directory: mobilipro
        env:
          MOBILIPRO_KEYSTORE_PATH: ${{ github.workspace }}/mobilipro/android/app/release-keystore.jks
          MOBILIPRO_KEYSTORE_PASSWORD: ${{ secrets.MOBILIPRO_KEYSTORE_PASSWORD }}
          MOBILIPRO_KEY_ALIAS: ${{ secrets.MOBILIPRO_KEY_ALIAS }}
          MOBILIPRO_KEY_PASSWORD: ${{ secrets.MOBILIPRO_KEY_PASSWORD }}
        # --obfuscate + --split-debug-info (AUDIT-MOBILI.md §4.6) : le nom des classes/
        # méthodes Dart n'apparaît plus dans l'APK release. Les symboles nécessaires pour
        # ré-associer un crash obfusqué (flutter symbolize) sont écrits à part et uploadés
        # en artefact CI ci-dessous — jamais dans l'APK distribué.
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: Upload symboles de débogage (obfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: mobilipro-debug-info-${{ github.sha }}
          path: mobilipro/build/debug-info
          retention-days: 90

      # Meme fragilite que deploy-mobileapp.yml (voir son commentaire) :
      # wzieba/Firebase-Distribution-Github-Action n'a pas de retry, un upload
      # lent fait echouer tout le job sans nouvelle tentative.
      # NODE_OPTIONS=--dns-result-order=ipv4first : voir le commentaire dans
      # deploy-mobileapp.yml (meme fragilite reseau IPv6 sur les runners
      # GitHub Actions, meme correctif).
      - name: Distribute via Firebase (avec retry)
        uses: nick-fields/retry@v3
        env:
          FIREBASE_TOKEN_FILE_CONTENT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        with:
          timeout_minutes: 6
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            echo "$FIREBASE_TOKEN_FILE_CONTENT" > /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@13 appdistribution:distribute \
              mobilipro/build/app/outputs/flutter-apk/app-release.apk \
              --app "1:908432245037:android:0b00c6f5d27550d72bd3a4" \
              --groups "Mobili-business"